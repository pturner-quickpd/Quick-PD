# Quick PD · Wewoka High — static site served by a Cloudflare Worker.
# Cloudflare Workers Builds is bound to the "quick-pd1" service in the dashboard.
# We deliberately keep `name = "turnerpd"` here because that config was building
# and deploying successfully to quick-pd1.pt2479.workers.dev — the CF Builds
# integration uses the dashboard-bound service, not the wrangler.toml name.
name = "turnerpd"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
# Hash router (#/route) means every path can serve index.html.
not_found_handling = "single-page-application"
